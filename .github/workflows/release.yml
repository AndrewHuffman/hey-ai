name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write # Required for npm Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[no-release]') && !contains(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }} # Uses deploy key to bypass branch rules

      - name: Set up release toolchain
        uses: ./.github/actions/setup-release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test --runInBand --verbose

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare verified release
        id: prepare
        uses: ./.github/actions/prepare-release
        with:
          release_type: ${{ inputs.release_type || 'auto' }}
          tarball_path: ${{ runner.temp }}/hey-ai.tgz
          publish_dry_run: "false"

      # IMPORTANT: Publish to npm BEFORE pushing anything
      # If this fails, no commit/tag will be pushed
      - name: Publish to npm (Trusted Publishing)
        run: npm publish "${{ runner.temp }}/hey-ai.tgz" --access public

      # Only runs if npm publish succeeded
      - name: Commit and tag
        run: |
          git add package.json pnpm-lock.yaml CHANGELOG.md
          git commit -m "chore(release): ${{ steps.prepare.outputs.new_version }}" || echo "No changes to commit"
          git tag ${{ steps.prepare.outputs.new_version }}

      - name: Push changes
        run: |
          # SSH key is already configured by checkout step
          git fetch origin main
          git push --force-with-lease origin main
          git push origin ${{ steps.prepare.outputs.new_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.new_version }}
          body: |
            ${{ steps.prepare.outputs.changelog }}

            ## Install

            ```bash
            npm install -g hey-ai
            ```

            ## Prerequisites

            Requires the [llm CLI](https://llm.datasette.io/):
            ```bash
            brew install llm  # or: pipx install llm
            llm keys set openai
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
