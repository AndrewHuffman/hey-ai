name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  minimum_runtime:
    name: Runtime Compatibility (Node 22.13.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1 libsqlite3-dev libblas3 liblapack3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up minimum Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test --runInBand --verbose

  release_preflight:
    name: Release Preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up release toolchain
        uses: ./.github/actions/setup-release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test --runInBand --verbose

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Prepare release candidate
        uses: ./.github/actions/prepare-release
        with:
          release_type: auto
          tarball_path: ${{ runner.temp }}/hey-ai.tgz
          publish_dry_run: "true"

      - name: Lint
        run: |
          # Add lint script to package.json later if needed
          # pnpm run lint
          echo "No lint script defined yet"

  validation:
    name: PR Validation
    if: ${{ always() }}
    needs: [minimum_runtime, release_preflight]
    runs-on: ubuntu-latest

    steps:
      - name: Confirm all validation jobs passed
        env:
          MINIMUM_RUNTIME_RESULT: ${{ needs.minimum_runtime.result }}
          RELEASE_PREFLIGHT_RESULT: ${{ needs.release_preflight.result }}
        run: |
          if [ "$MINIMUM_RUNTIME_RESULT" != "success" ] || [ "$RELEASE_PREFLIGHT_RESULT" != "success" ]; then
            echo "Minimum runtime result: $MINIMUM_RUNTIME_RESULT"
            echo "Release preflight result: $RELEASE_PREFLIGHT_RESULT"
            exit 1
          fi
