name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: PR Validation (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1 libsqlite3-dev libblas3 liblapack3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test --runInBand --verbose

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Verify package artifact
        run: pnpm run test:package

      - name: Lint
        run: |
          # Add lint script to package.json later if needed
          # pnpm run lint
          echo "No lint script defined yet"

  validation:
    name: PR Validation
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Confirm validation matrix passed
        env:
          VALIDATION_MATRIX_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$VALIDATION_MATRIX_RESULT" != "success" ]; then
            echo "Validation matrix result: $VALIDATION_MATRIX_RESULT"
            exit 1
          fi
